<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./img/icon.png" rel="icon" />
    <title>卡啦卡啦煎起來！</title>
    <script>
      if (
        new URLSearchParams(window.location.search).has("preload-transition")
      ) {
        document.documentElement.classList.add("preload-transition");
      }
    </script>
    <link rel="stylesheet" href="./css/Kend_style.css" />
  </head>
  <body class="feedback-page">
    <main class="game_stage feedback_stage">
      <img
        class="feedback_background"
        src="./img/end_feedback.gif"
        alt="成果回饋單底圖"
      />
      <div class="feedback_name" id="feedbackName"></div>
      <div class="feedback_score" id="feedbackScore"></div>
      <button class="certificate_button" id="certificateOpen" type="button">
        領取證照
      </button>
    </main>
    <div
      class="certificate_modal"
      id="certificateModal"
      role="dialog"
      aria-modal="true"
      aria-label="證照"
      hidden
    >
      <div class="certificate_panel">
        <button
          class="certificate_close"
          id="certificateClose"
          type="button"
          aria-label="關閉"
        >
          ×
        </button>
        <div class="certificate_card" id="certificateCard" hidden>
          <div class="certificate_artwork">
            <div class="certificate_paper">
              <img class="certificate_result" id="certificateResult" alt="" />
              <span class="certificate_shine" aria-hidden="true"></span>
            </div>
            <span
              class="certificate_player_name"
              id="certificatePlayerName"
            ></span>
            <div
              class="certificate_character"
              role="img"
              aria-label="戴帽子的廚師人物與餐具插圖"
            >
              <div class="character_crop">
                <img
                  class="character_layer character_base"
                  id="certificateCharacterBase"
                  src="./img/end_feedback_pic.png"
                  alt=""
                />
                <img
                  class="character_layer character_decoration"
                  src="./img/end_feedback_decoration.png"
                  alt=""
                />
              </div>
              <div
                class="character_photo_frame"
                id="certificateCharacterPhotoFrame"
                role="img"
                aria-label="玩家照片"
                hidden
              >
                <img
                  class="character_photo"
                  id="certificateCharacterPhoto"
                  alt=""
                />
              </div>
              <img
                class="character_layer character_hat"
                id="certificateHat"
                src="./img/end_feedback_hat.png"
                alt=""
              />
            </div>
          </div>
        </div>
        <p class="certificate_message" id="certificateMessage" hidden></p>
        <a class="certificate_home_button" href="./index.html">回首頁</a>
      </div>
    </div>
    <script src="./js/scale.js"></script>
    <script src="./js/Kend_feedback.js"></script>
    <script src="./js/certificate_modal.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
