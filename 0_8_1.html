<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./img/icon.png" rel="icon" />
    <title>卡啦卡啦煎起來！</title>
    <script>
      if (
        new URLSearchParams(window.location.search).has("preload-transition")
      ) {
        document.documentElement.classList.add("preload-transition");
      }
    </script>
    <link rel="stylesheet" href="./css/Kend_style.css" />
  </head>
  <body class="feedback-page">
    <main class="game_stage feedback_stage">
      <img
        class="feedback_background"
        src="./img/end_feedback.gif"
        alt="成果回饋單底圖"
      />
      <div class="feedback_name" id="feedbackName"></div>
      <div class="feedback_score" id="feedbackScore"></div>
      <button class="certificate_button" id="certificateOpen" type="button">
        領取證照
      </button>
    </main>
    <div class="certificate_modal" id="certificateModal" role="dialog" aria-modal="true" aria-labelledby="certificateTitle" hidden>
      <div class="certificate_panel">
        <button class="certificate_close" id="certificateClose" type="button" aria-label="關閉">×</button>
        <h1 id="certificateTitle">領取證照</h1>
        <p>恭喜完成挑戰！</p>
        <div class="certificate_items">
          <div class="certificate_item">
            <div class="certificate_portrait_frame">
              <div class="certificate_portrait_placeholder" id="certificatePortraitPlaceholder">證件照照片預留位置</div>
            </div>
            <span>證件照</span>
          </div>
          <div class="certificate_item">
            <div class="certificate_art_frame"><img src="./img/hat.png" alt="帽子" /></div>
            <span>帽子</span>
          </div>
          <div class="certificate_item">
            <div class="certificate_art_frame certificate_shovel" aria-label="鏟子圖片預留位置">🪏</div>
            <span>鏟子</span>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/scale.js"></script>
    <script src="./js/Kend_feedback.js"></script>
    <script src="./js/certificate_modal.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
