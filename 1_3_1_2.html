<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/grind_tea_camera_game.css" rel="stylesheet" />
    <title>卡啦卡啦煎起來！</title>
  </head>
  <body>
    <video
      class="camera_feed"
      id="cameraFeed"
      autoplay
      muted
      playsinline
      aria-hidden="true"
    ></video>
    <main class="game_stage" id="gameStage">
      <img
        class="basket_overlay"
        src="./img/basket.gif"
        alt=""
        aria-hidden="true"
      />
      <img class="tea" src="./img/tea.GIF" alt="茶葉" />
      <section class="follow_area" aria-label="跟著牛移動手掌，控制杵子">
        <img class="bar" src="./img/bar.png" alt="" />
        <div class="track" id="track">
          <div class="cow_guide" id="cowGuide" aria-hidden="true"></div>
          <div class="cow" id="cow">
            <img class="cow_art" src="./img/cow.GIF" alt="左右移動目標" />
          </div>
        </div>
        <p class="instruction">左右移動手掌，跟著牛移動杵子。</p>
        <p class="feedback" id="feedback" aria-live="polite">準備開始</p>
      </section>
      <p
        class="camera_status"
        id="cameraStatus"
        role="status"
        aria-live="polite"
      >
        請將一隻手掌放進鏡頭畫面
      </p>
      <img class="pestle" id="pestle" src="./img/pestle.png" alt="" />
    </main>
    <script src="./js/scale.js"></script>
    <script type="module" src="./js/grind_tea_hand_game.js"></script>
  </body>
</html>
