<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./css/level5_style.css" rel="stylesheet" />
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage">
      <div class="bg_layer"></div>
      <div class="level5_bg opacity_half"></div>
      <div class="end_container"></div>
      <section class="modal6_container">
        <div class="popwidow6" aria-hidden="true">
          <img
            class="popwidow6_overlay"
            id="level5EndingPopupOverlay"
            alt=""
            aria-hidden="true"
          />
        </div>
        <button
          class="next_button"
          id="nextBtn"
          type="button"
          aria-label="下一步"
        >
          <span class="visually_hidden"></span>
        </button>
      </section>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/level5_script.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
