<!doctype html>
<!-- Level 3 結尾頁：呈現結尾彈窗與前往下一關的按鈕。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./css/level3_style.css" rel="stylesheet" />
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage">
      <div class="bg_layer"></div>
      <div class="scene_frame scene_frame_fried_egg" aria-hidden="true"></div>
      <div class="level3_bg opacity_half"></div>
      <section class="modal4_container">
        <div class="popwidow4" aria-hidden="true">
          <img
            class="popwidow4_overlay"
            id="endingPopupOverlay"
            alt=""
            aria-hidden="true"
          />
        </div>
        <button
          class="next_button"
          id="nextBtn"
          type="button"
          aria-label="下一步"
        >
          <span class="visually_hidden">下一步</span>
        </button>
      </section>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/level3_script.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
