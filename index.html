<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./css/index.css" rel="stylesheet" />
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage">
      <img
        id="animation"
        class="animation-frame is-active is-visible"
        src="./img/door_animation.gif"
        alt="動畫"
      />
      <img
        id="animation-buffer"
        class="animation-frame"
        alt=""
        aria-hidden="true"
      />
      <div id="parallax-scene" class="parallax-scene" hidden aria-hidden="true">
        <img
          class="parallax-layer"
          data-src="./img/begin_zindex_0.gif"
          data-depth="0.25"
          alt=""
        />
        <img
          class="parallax-layer"
          data-src="./img/begin_zindex_1.gif"
          data-depth="0.5"
          alt=""
        />
        <img
          class="parallax-layer"
          id="yummy"
          data-src="./img/begin_zindex_2.gif"
          data-depth="0.75"
          alt=""
        />
        <img
          class="parallax-layer"
          data-src="./img/begin_zindex_3.gif"
          data-depth="1"
          alt=""
        />
      </div>
      <button
        id="begin-button"
        class="begin-button"
        type="button"
        hidden
        aria-label="循環"
      >
        <img src="./img/begin_button_default.png" alt="" />
      </button>
    </main>
    <script src="./js/index.js"></script>
    <script src="./js/scale.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
