<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第二關：接牛奶</title>
    <link href="./css/Devel4_style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="game_stage game_mode" aria-label="接牛奶遊戲">
      <div class="game_background" aria-hidden="true"></div>
      <div class="milk_layer" id="milkLayer" aria-hidden="true"></div>

      <!-- 四個奶頭座標請在 Devel4_script.js 的 CONFIG.teats 修改。 -->
      <img
        class="cow_art"
        src="./img/cow_animation.gif"
        alt=""
        aria-hidden="true"
      />
      <div class="teat_markers" id="teatMarkers" aria-hidden="true"></div>

      <!-- 瓶子素材是完整 1920×1080 畫布；容器只裁出瓶子圖案供拖曳。 -->
      <div
        class="bottle_drag"
        id="bottle"
        role="img"
        aria-label="可拖曳的接奶瓶"
        tabindex="0"
      >
        <img src="./img/bottle.gif" alt="" draggable="false" />
      </div>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/Devel4_script.js"></script>
  </body>
</html>
