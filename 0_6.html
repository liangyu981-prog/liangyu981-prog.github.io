<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/level5_style.css" rel="stylesheet" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage">
      <div class="bg_layer"></div>
      <div class="level5_bg opacity_half"></div>
      <div class="modal5_container">
        <div class="popinfor5"></div>
        <button
          class="start_button"
          id="startBtn"
          type="button"
          aria-label="start_button"
        ></button>
      </div>
       <!-- 左上角遊戲介紹按鈕；圖片檔名與位置尺寸在 level1_style.css 調整。 -->
      <button
        class="game_intro_button"
        id="gameIntroButton"
        type="button"
        aria-label="遊戲介紹"
        aria-haspopup="dialog"
        aria-controls="gameIntroDialog"
      ></button>

      <!-- 遊戲介紹遮罩預設隱藏；關閉後不攔截主畫面或開始按鈕的操作。 -->
      <div class="game_intro_overlay" id="gameIntroOverlay" hidden>
        <section
          class="game_intro_dialog"
          id="gameIntroDialog"
          role="dialog"
          aria-modal="true"
          aria-label="遊戲介紹"
        >
          <!-- 視窗底圖：img/1_game_intro.png；位置與尺寸見 CSS。 -->
          <img class="game_intro_paper" src="./img/5_game_intro.png" alt="" />

          <!-- 遊戲示意圖：img/1_small_game_intro.png；位置與尺寸見 CSS。 -->
          <img
            class="game_intro_demo"
            src="./img/5_small_game_intro.gif"
            alt="雞群從洞穴中出現的遊戲示意圖"
          />

          <!-- 關閉圖案：img/x.png；點擊後關閉介紹視窗。 -->
          <button
            class="game_intro_close"
            id="gameIntroClose"
            type="button"
            aria-label="關閉遊戲介紹"
          ></button>

          <!-- 確認按鈕：img/iknow_button_default.png 與 iknow_button_active.png。 -->
          <button
            class="game_intro_confirm"
            id="gameIntroConfirm"
            type="button"
            aria-label="我雞道了，關閉遊戲介紹"
          ></button>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/level5_script.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
