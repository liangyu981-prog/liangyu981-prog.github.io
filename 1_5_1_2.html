<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第二關：接牛奶（鏡頭模式）</title>
    <link href="./css/Devel4_style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="game_stage game_mode camera_mode" aria-label="鏡頭接牛奶遊戲">
      <div class="game_background" aria-hidden="true"></div>
      <video
        class="camera_video"
        id="cameraVideo"
        autoplay
        muted
        playsinline
        aria-hidden="true"
      ></video>
      <img
        class="camera_cow_overlay"
        src="./img/cow_animation.gif"
        alt=""
        aria-hidden="true"
      />
      <div class="milk_layer" id="milkLayer" aria-hidden="true"></div>
      <div class="teat_markers" id="teatMarkers" aria-hidden="true"></div>

      <div
        class="bottle_drag"
        id="bottle"
        role="img"
        aria-label="用手部上下左右移動控制接奶瓶"
      >
        <img src="./img/bottle.gif" alt="" draggable="false" />
      </div>
      <p
        class="camera_status"
        id="cameraStatus"
        role="status"
        aria-live="polite"
      >
        正在啟動鏡頭與手部偵測……
      </p>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/Devel4_script.js"></script>
    <script type="module" src="./js/Devel4_camera.js"></script>
  </body>
</html>
