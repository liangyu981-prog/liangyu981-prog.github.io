<!doctype html>
<!-- Level 4 遊戲頁：呈現 Level 4 背景並載入舞台縮放與關卡腳本。 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./css/level4_style.css" rel="stylesheet" />
    <link rel="preload" as="image" href="./img/Gtimer_4.35s.gif" />
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage">
      <div class="bg_layer"></div>
      <div class="level4_bg opacity_full"></div>
      <div class="question_progress" aria-label="題目進度">2/3</div>
      <div class="Gtimer">
        <img data-src="./img/Gtimer_4.35s.gif" alt="遊戲計時器" />
      </div>
      <!-- 2️⃣ 📌 替換成第二題的題目圖片路徑 -->
      <div class="question_image_container">
        <img
          src="./img/level4_Ｑ_2.png"
          alt="第二大題題目"
          class="question_img"
        />
      </div>

      <!-- 📌 2. 底部三個選項按鈕 -->
      <div class="answers_container">
        <!-- 🎯 題目說「第二題是第一個選項是對的」，所以把這裡改成 "correct" -->
        <button
          class="ans_button"
          id="btnOption4"
          data-answer="correct"
          type="button"
        ></button>

        <!-- 第二個選項是錯的 -->
        <button
          class="ans_button"
          id="btnOption5"
          data-answer="wrong"
          type="button"
        ></button>

        <!-- 第三個選項是錯的 -->
        <button
          class="ans_button"
          id="btnOption6"
          data-answer="wrong"
          type="button"
        ></button>
      </div>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/level4_script.js"></script>
    <script src="./js/global_bgm.js"></script>
  </body>
</html>
