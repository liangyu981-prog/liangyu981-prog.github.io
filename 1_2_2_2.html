<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./css/devel1_style.css" rel="stylesheet" />
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <div class="score_display" id="score_display" aria-live="polite">
      本次得分：0 分｜累計積分：0 分
    </div>
    <div
      class="devel1_Q2_bg camera_game_background opacity_full"
      data-correct-direction="right"
      data-next-page="1_2_3_2.html"
      data-stop-image="./img/devel1_Q2_stop_bg.png"
      data-animation-duration-ms="2160"
    >
      <img src="./img/1_2_find_tea_Q2.gif" alt="" />
    </div>
    <section class="camera_detection_panel" aria-label="鏡頭頭部方向偵測">
      <div class="camera_preview_wrap">
        <video
          class="camera_detection_video"
          id="camera_preview"
          autoplay
          muted
          playsinline
          aria-label="鏡頭預覽"
        ></video>
        <svg
          class="face_direction_guide"
          id="face_direction_guide"
          viewBox="0 0 200 200"
          aria-hidden="true"
        >
          <path
            class="guide_region guide_right"
            d="M100 100L100 18A82 82 0 0 1 100 182Z"
          />
          <path
            class="guide_region guide_left"
            d="M100 100L100 182A82 82 0 0 1 100 18Z"
          />
          <path class="guide_crosshair" d="M100 18V182" />
          <path
            class="guide_direction guide_right"
            d="M158 42A82 82 0 0 1 158 158"
          />
          <path
            class="guide_direction guide_left"
            d="M42 158A82 82 0 0 1 42 42"
          />
        </svg>
      </div>
      <p
        class="camera_detection_status"
        id="camera_status"
        role="status"
        aria-live="polite"
      >
        正在啟動鏡頭，請允許攝影機權限。
      </p>
    </section>
    <script src="./js/scale.js"></script>
    <script src="./js/global_bgm.js"></script>
    <script type="module" src="./js/camera_game.js"></script>
  </body>
</html>
