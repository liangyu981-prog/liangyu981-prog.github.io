<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./css/devel1_style.css" rel="stylesheet" />
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage">
      <video
        class="camera_fullscreen_video"
        id="camera_preview"
        autoplay
        muted
        playsinline
        aria-label="鏡頭畫面"
      ></video>
      <div class="score_display" id="score_display" aria-live="polite">
        本次得分：0 分｜累計積分：0 分
      </div>
      <div
        class="devel1_Q2_bg camera_game_background opacity_full"
        data-correct-direction="right"
        data-next-page="1_2_3_2.html"
        data-stop-image="./img/devel1_Q2_stop_bg.png"
        data-answer-image="./img/1_2_find_tea_A2.gif"
      data-animation-duration-ms="2800"
        data-animation-last-frame-ms="30"
        data-answer-duration-ms="1760"
        data-answer-last-frame-ms="80"
      >
        <img src="./img/1_2_find_tea_Q2.gif" alt="" />
      </div>
      <svg
        class="face_direction_guide"
        id="face_direction_guide"
        viewBox="0 0 1920 1080"
        aria-hidden="true"
      >
        <path class="guide_crosshair" d="M960 0V1080" />
      </svg>
      <svg
        class="camera_person_guide"
        id="camera_person_guide"
        viewBox="0 0 200 300"
        aria-hidden="true"
      >
        <circle cx="100" cy="54" r="34" />
        <path
          d="M100 90V190M45 132L100 108L155 132M100 190L55 280M100 190L145 280"
        />
      </svg>
      <p
        class="camera_detection_status"
        id="camera_status"
        role="status"
        aria-live="polite"
      >
        正在啟動鏡頭，請允許攝影機權限。
      </p>
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/global_bgm.js"></script>
    <script type="module" src="./js/devel1_cam_script.js"></script>
  </body>
</html>
