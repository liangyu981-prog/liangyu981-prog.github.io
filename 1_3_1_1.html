<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/grind_tea_game.css" rel="stylesheet" />
    <title>卡啦卡啦煎起來！</title>
    <link href="./img/icon.png" rel="icon" />
  </head>
  <body>
    <main class="game_stage" id="gameStage">
      <div class="game_background" aria-hidden="true"></div>
      <img class="tea" src="./img/tea.GIF" alt="茶葉" />

      <section class="follow_area" aria-label="跟著牛移動滑鼠，控制杵子">
        <img class="bar" src="./img/bar.png" alt="" />
        <div class="track" id="track">
          <div class="cow_guide" id="cowGuide" aria-hidden="true"></div>
          <div class="cow" id="cow">
            <img class="cow_art" src="./img/cow.GIF" alt="左右移動目標" />
          </div>
        </div>
        <p class="instruction">移動滑鼠，跟著牛的位置控制杵子。</p>
        <p class="feedback" id="feedback" aria-live="polite">準備開始</p>
      </section>

      <img class="pestle" id="pestle" src="./img/pestle.png" alt="" />
    </main>
    <script src="./js/scale.js"></script>
    <script src="./js/global_bgm.js"></script>
    <script src="./js/grind_tea_game.js"></script>
  </body>
</html>
